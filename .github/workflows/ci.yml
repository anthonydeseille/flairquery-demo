name: ci

# The demo's tests on every pull request (FlairQuery's regression tests included): Testcontainers PostgreSQL.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and tests
        run: ./mvnw -B verify
